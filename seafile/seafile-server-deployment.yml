apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-server
  namespace: seafile
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: seafile-server
  template:
    metadata:
      labels:
        app: seafile-server
    spec:
      containers:
      - image: seafileltd/seafile-pro-mc:13.0.28
        name: seafile-server
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 250m
            memory: 2000Mi
          limits:
            cpu: 3000m
            memory: 8000Mi
        volumeMounts:
        - name: data
          mountPath: /shared
        ports:
          - containerPort: 80
        env:
          - name: DB_HOST
            value: seafile-mariadb.seafile.svc.cluster.local
          - name: DB_ROOT_PASSWD
            valueFrom:
              secretKeyRef:
                name: seafile-t67h68f6gt
                key: mysql-root-password
                optional: false
          - name: TIME_ZONE
            value: Europe/Paris
          - name: SEAFILE_ADMIN_EMAIL
            valueFrom:
              secretKeyRef:
                name: seafile-t67h68f6gt
                key: admin-mail
                optional: false
          - name: SEAFILE_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: seafile-t67h68f6gt
                key: admin-password
                optional: false
          - name: JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: seafile-t67h68f6gt
                key: jwt-private-key
                optional: false
          - name: SEAFILE_SERVER_PROTOCOL
            value: https
          - name: SEAFILE_SERVER_HOSTNAME
            value: cloud.dysnomia.studio
          - name: SEAFILE_MYSQL_DB_HOST
            value: seafile-mariadb.seafile.svc.cluster.local
          - name: SEAFILE_MYSQL_DB_PORT
            value: '3306'
          - name: SEAFILE_MYSQL_DB_USER
            value: seafile
          - name: SEAFILE_MYSQL_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: seafile-t67h68f6gt
                key: mysql-password
                optional: false
          - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
            value: ccnet_db
          - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
            value: seafile_db
          - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
            value: seahub_db
          - name: CACHE_PROVIDER
            value: redis
          - name: REDIS_HOST
            value: seafile-redis.seafile.svc.cluster.local
          - name: REDIS_PORT
            value: '6379'

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: longhorn-pvc-seafile-server-data
