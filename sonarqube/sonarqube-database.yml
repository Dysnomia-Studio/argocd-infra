apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarqube-database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  bootstrap:
    initdb:
      database: sonarqube
      owner: sonarqube

  enableSuperuserAccess: true

  resources:
    requests:
      memory: "512Mi"
      cpu: 250m
    limits:
      memory: "1Gi"
      cpu: '1'

  storage:
    size: 7.5Gi
