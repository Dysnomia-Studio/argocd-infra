apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    ports:
      web:
        port: 80
        hostPort: 80
      websecure:
        port: 443
        hostPort: 443
    service:
      enabled: false   # no LoadBalancer/Service needed for external access anymore
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
    additionalArguments:
      - "--log.level=DEBUG"
      - "--providers.kubernetescrd.allowCrossNamespace=true"
      - "--experimental.otlpLogs=true"
      - "--accesslog.otlp.http.endpoint=http://192.168.1.6:4318/v1/logs"
      - "--entryPoints.websecure.http.middlewares=dysnomia-apps-http-compress@kubernetescrd"