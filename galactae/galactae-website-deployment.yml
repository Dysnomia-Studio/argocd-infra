apiVersion: apps/v1
kind: Deployment
metadata:
  name: galactae-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: galactae-website
  template:
    metadata:
      labels:
        app: galactae-website
    spec:
      containers:
      - image: nginx:latest
        name: galactae-website
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 5m
            memory: 15Mi
          limits:
            cpu: 5m
            memory: 15Mi