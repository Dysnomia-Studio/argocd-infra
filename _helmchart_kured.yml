apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
spec:
  project: default
  sources:
    - chart: kured
      repoURL: oci://ghcr.io/kubereboot/charts/kured
      targetRevision: 6.1.0
      helm:
        values: |
          configuration:
            lockReleaseDelay: 4h
            drainPodSelector: "app.kubernetes.io/component!=database,longhorn.io/managed-by!=longhorn-manager"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
